const ivory=new THREE.MeshPhysicalMaterial({color:0xfff8e9,roughness:.115,metalness:0,ior:1.48,clearcoat:1,clearcoatRoughness:.055,envMapIntensity:2.25});const black=new THREE.MeshPhysicalMaterial({color:0x08090c,roughness:.23,clearcoat:.75,clearcoatRoughness:.15});const red=new THREE.MeshPhysicalMaterial({color:0xc50918,roughness:.24,clearcoat:.8});const lip=new THREE.MeshStandardMaterial({color:0xd2bda0,roughness:.4});
const pipPatterns={1:[[0,0]],2:[[-1,-1],[1,1]],3:[[-1,-1],[0,0],[1,1]],4:[[-1,-1],[-1,1],[1,-1],[1,1]],5:[[-1,-1],[-1,1],[0,0],[1,-1],[1,1]],6:[[-1,-1],[-1,0],[-1,1],[1,-1],[1,0],[1,1]]};
const faces=[{n:1,normal:[0,1,0]},{n:6,normal:[0,-1,0]},{n:2,normal:[0,0,1]},{n:5,normal:[0,0,-1]},{n:3,normal:[1,0,0]},{n:4,normal:[-1,0,0]}];
function dieMesh(){const group=new THREE.Group();const cube=new THREE.Mesh(base,ivory);cube.castShadow=true;cube.receiveShadow=true;group.add(cube);for(const face of faces){const n=new THREE.Vector3(...face.normal);const rot=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,0,1),n);for(const [u,v] of pipPatterns[face.n]){const x=u*.30,y=v*.30;const origin=new THREE.Vector3(x,y,HALF+.002).applyQuaternion(rot);const ring=new THREE.Mesh(new THREE.TorusGeometry(.137,.011,12,48),lip);ring.position.copy(origin);ring.quaternion.copy(rot);group.add(ring);const dot=new THREE.Mesh(new THREE.CircleGeometry(.128,64),face.n===1?red:black);dot.position.copy(new THREE.Vector3(x,y,HALF+.005).applyQuaternion(rot));dot.quaternion.copy(rot);group.add(dot)}}return group}
// 近接時に濃く、浮き上がると淡く広がる接触影（スマホ向け軽量方式）
const shadowCanvas=document.createElement('canvas');shadowCanvas.width=128;shadowCanvas.height=128;
const sc=shadowCanvas.getContext('2d');const sg=sc.createRadialGradient(64,64,4,64,64,64);
sg.addColorStop(0,'rgba(0,0,0,.90)');sg.addColorStop(.32,'rgba(0,0,0,.66)');sg.addColorStop(.7,'rgba(0,0,0,.11)');sg.addColorStop(1,'rgba(0,0,0,0)');sc.fillStyle=sg;sc.fillRect(0,0,128,128);
const shadowTex=new THREE.CanvasTexture(shadowCanvas);
let dice=[],count=1,rolling=false,history=[];const tmpV=new THREE.Vector3(),tmpQ=new THREE.Quaternion(),up=new THREE.Vector3(0,1,0);
function clearDice(){for(const d of dice){world.removeRigidBody(d.body);scene.remove(d.mesh);scene.remove(d.contactShadow);d.contactShadow.material.dispose()}dice=[]}
function spawn(n){clearDice();for(let i=0;i<n;i++){const mesh=dieMesh();scene.add(mesh);
const contactShadow=new THREE.Mesh(new THREE.PlaneGeometry(2.65,2.65),new THREE.MeshBasicMaterial({map:shadowTex,transparent:true,depthWrite:false,opacity:.86,polygonOffset:true,polygonOffsetFactor:-1}));
contactShadow.rotation.x=-Math.PI/2;contactShadow.position.y=.008;contactShadow.renderOrder=2;scene.add(contactShadow);const x=(i%3-1)*1.82+(Math.random()-.5)*.06,z=(Math.floor(i/3)-.5)*1.82+(Math.random()-.5)*.06;const body=world.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(x,4.1+Math.floor(i/3)*.55,z).setLinearDamping(.42).setAngularDamping(.55).setCanSleep(true));world.createCollider(RAPIER.ColliderDesc.cuboid(HALF-.065,HALF-.065,HALF-.065).setDensity(1.15).setFriction(.48).setRestitution(.19),body);const q=new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.random()*6,Math.random()*6,Math.random()*6));body.setRotation(q,true);body.setLinvel({x:(Math.random()-.5)*1.9,y:.2+Math.random()*.7,z:(Math.random()-.5)*1.9},true);body.setAngvel({x:(Math.random()-.5)*24,y:(Math.random()-.5)*24,z:(Math.random()-.5)*24},true);dice.push({mesh,body,contactShadow})}}
function faceUp(body){const q=body.rotation();tmpQ.set(q.x,q.y,q.z,q.w);let best=1,bestDot=-Infinity;for(const f of faces){const dot=tmpV.set(...f.normal).applyQuaternion(tmpQ).dot(up);if(dot>bestDot){bestDot=dot;best=f.n}}return best}
let rollStart=0,settle=0;function throwDice(){if(rolling)return;rolling=true;rollBtn.disabled=true;rollBtn.textContent='転がっています…';result.textContent='🎲 転がっています…';spawn(count);rollStart=performance.now();settle=0}
function finish(){if(!rolling)return;rolling=false;for(const d of dice){d.body.setLinvel({x:0,y:0,z:0},true);d.body.setAngvel({x:0,y:0,z:0},true);d.body.sleep()}const values=dice.map(d=>faceUp(d.body));const sum=values.reduce((a,b)=>a+b,0);result.textContent=`出目：${values.join('・')}　｜　合計 ${sum}`;rollBtn.disabled=false;rollBtn.textContent='🎲 もう一度振る';history.unshift({values,sum});history=history.slice(0,30);document.querySelector('#log').innerHTML=history.map(h=>`<li>${h.values.join('・')}（合計 ${h.sum}）</li>`).join('')}
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?53:42;camera.position.set(w<h?5.7:6.4,w<h?10.8:8.8,w<h?13.8:11.6);camera.lookAt(0,.55,0);camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
let last=performance.now(),acc=0;function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.06);last=now;acc+=dt;while(acc>=1/120){world.timestep=1/120;world.step();acc-=1/120}for(const d of dice){const p=d.body.translation(),q=d.body.rotation();d.mesh.position.set(p.x,p.y,p.z);d.mesh.quaternion.set(q.x,q.y,q.z,q.w);
const height=Math.max(0,p.y-HALF);d.contactShadow.position.x=p.x;d.contactShadow.position.z=p.z;
const spread=1+Math.min(height,5)*.21;d.contactShadow.scale.set(spread,spread,1);
d.contactShadow.material.opacity=Math.max(.08,.86-height*.13);
}if(rolling){const elapsed=now-rollStart;const slow=dice.every(d=>{const v=d.body.linvel(),a=d.body.angvel();return d.body.isSleeping()||(Math.hypot(v.x,v.y,v.z)<.42&&Math.hypot(a.x,a.y,a.z)<.65)});settle=slow?settle+dt:0;if((elapsed>1400&&settle>.55)||elapsed>6500)finish()}renderer.render(scene,camera)}requestAnimationFrame(frame);
document.querySelector('#minus').onclick=()=>{if(rolling)return;count=Math.max(1,count-1);document.querySelector('#count').textContent=count};document.querySelector('#plus').onclick=()=>{if(rolling)return;count=Math.min(6,count+1);document.querySelector('#count').textContent=count};document.querySelector('#historyBtn').onclick=()=>{const el=document.querySelector('#history');el.style.display=el.style.display==='block'?'none':'block'};rollBtn.onclick=throwDice;rollBtn.disabled=false;// 初期サイコロを静置
spawn(1);for(const d of dice){d.body.setTranslation({x:0,y:.79,z:0},true);d.body.setLinvel({x:0,y:0,z:0},true);d.body.setAngvel({x:0,y:0,z:0},true);d.body.setRotation({x:0,y:0,z:0,w:1},true)}
}catch(e){fail(e)}
</script></body></html>
